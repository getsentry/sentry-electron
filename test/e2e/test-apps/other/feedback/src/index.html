<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <script>
      const { init, sendFeedback } = require('@sentry/electron/renderer');

      init({
        debug: true,
      });

      setTimeout(() => {
        sendFeedback({
          name: 'John Doe',
          email: 'john@doe.com',
          message: 'I really like your App, thanks!',
        }).then(
          () => {
            console.log('sendFeedback resolved');
            window.close();
          },
          (e) => console.error('sendFeedback rejected', e),
        );
      }, 500);
    </script>
  </body>
</html>
